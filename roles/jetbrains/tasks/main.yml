---
# tasks file for jetbrains (Toolbox + JetBrains Mono font on macOS)

- name: Determine allowed platform for JetBrains Toolbox handling (macOS MacBook only)
  ansible.builtin.set_fact:
    jetbrains_macos_allowed: >-
      {{ (ansible_facts['os_family'] | default('')) == 'Darwin' and (device_type | default('')) == 'macbook' }}

- name: Stop role when not on a supported platform (macOS MacBook)
  ansible.builtin.meta: end_role
  when: not (jetbrains_macos_allowed | bool)

- name: Conditional block for jetbrains

  when: jetbrains_macos_allowed | bool

  block:
    - name: Ensure JetBrains Toolbox is present via Homebrew Cask (macOS)
      community.general.homebrew_cask:
        name: jetbrains-toolbox
        state: present
      become: false

    - name: Ensure JetBrains Mono font is present via Homebrew Cask (macOS)
      community.general.homebrew_cask:
        name: font-jetbrains-mono
        state: present
      become: false
