---
# tasks file for terminal (install iTerm2 on macOS)

- name: Determine allowed platform for terminal setup (macOS MacBook only)
  ansible.builtin.set_fact:
    terminal_macos_allowed: >-
      {{ (ansible_facts['os_family'] | default('')) == 'Darwin' and (device_type | default('')) == 'macbook' }}

- name: Stop role when not on a supported platform (macOS MacBook)
  ansible.builtin.meta: end_role
  when: not (terminal_macos_allowed | bool)

- name: Conditional block for terminal

  when: terminal_macos_allowed | bool

  block:
    - name: Ensure iTerm2 is present via Homebrew Cask (macOS)
      community.general.homebrew_cask:
        name: iterm2
        state: present
      become: false
