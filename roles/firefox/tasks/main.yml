---
# tasks file for firefox (install via Homebrew Cask on macOS)

- name: Determine allowed platform for Firefox setup (macOS MacBook only)
  ansible.builtin.set_fact:
    firefox_macos_allowed: >-
      {{ (ansible_facts['os_family'] | default('')) == 'Darwin' and (device_type | default('')) == 'macbook' }}

- name: Stop role when not on a supported platform (macOS MacBook)
  ansible.builtin.meta: end_role
  when: not (firefox_macos_allowed | bool)

- name: Conditional block for firefox

  when: firefox_macos_allowed | bool

  block:
    - name: Ensure Firefox is present via Homebrew Cask (macOS)
      community.general.homebrew_cask:
        name: firefox
        state: present
      become: false
