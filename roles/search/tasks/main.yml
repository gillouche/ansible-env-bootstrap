---
# tasks file for search (install the_silver_searcher, ripgrep, fzf on macOS)

- name: Skip if role already executed
  meta: end_role
  when: vars[role_execution_flag] | default(false)

- name: Determine allowed platform for search tools setup (macOS MacBook only)
  set_fact:
    search_macos_allowed: >-
      {{ (ansible_facts['os_family'] | default('')) == 'Darwin' and (device_type | default('')) == 'macbook' }}

- name: Stop role when not on a supported platform (macOS MacBook)
  meta: end_role
  when: not (search_macos_allowed | bool)

- block:
    - name: Ensure search tools are installed via Homebrew (macOS)
      community.general.homebrew:
        name:
          - the_silver_searcher
          - ripgrep
          - fzf
        state: present
      become: false
  when: search_macos_allowed | bool

- name: Mark role as executed
  set_fact:
    "{{ role_execution_flag }}": true
    cacheable: true
