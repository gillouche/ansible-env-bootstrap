---
# tasks file for thunderbird (install via Homebrew Cask on macOS)

- name: Skip if role already executed
  meta: end_role
  when: vars[role_execution_flag] | default(false)

- name: Determine allowed platforms for Thunderbird setup (macOS MacBook only)
  set_fact:
    thunderbird_macos_allowed: >-
      {{ (ansible_facts['os_family'] | default('')) == 'Darwin' and (device_type | default('')) == 'macbook' }}

- name: Stop role when not on a supported platform (macOS MacBook)
  meta: end_role
  when: not (thunderbird_macos_allowed | bool)

- block:
    - name: Ensure Thunderbird is present via Homebrew Cask (macOS)
      community.general.homebrew_cask:
        name: thunderbird
        state: present
      become: false
  when: thunderbird_macos_allowed | bool

- name: Mark role as executed
  set_fact:
    "{{ role_execution_flag }}": true
    cacheable: true
