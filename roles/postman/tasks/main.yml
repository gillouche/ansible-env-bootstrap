---
# tasks file for postman (install via Homebrew Cask on macOS)

- name: Determine allowed platform for Postman setup (macOS MacBook only)
  ansible.builtin.set_fact:
    postman_macos_allowed: >-
      {{ (ansible_facts['os_family'] | default('')) == 'Darwin' and (device_type | default('')) == 'macbook' }}

- name: Stop role when not on a supported platform (macOS MacBook)
  ansible.builtin.meta: end_role
  when: not (postman_macos_allowed | bool)

- name: Conditional block for postman

  when: postman_macos_allowed | bool

  block:
    - name: Ensure Postman is present via Homebrew Cask (macOS)
      community.general.homebrew_cask:
        name: postman
        state: present
      become: false
