---
# tasks file for raspberrypi (install Raspberry Pi Imager on macOS)

- name: Skip if role already executed
  meta: end_role
  when: vars[role_execution_flag] | default(false)

- name: Determine allowed platform for Raspberry Pi Imager setup (macOS MacBook only)
  set_fact:
    rpi_macos_allowed: >-
      {{ (ansible_facts['os_family'] | default('')) == 'Darwin' and (device_type | default('')) == 'macbook' }}

- name: Stop role when not on a supported platform (macOS MacBook)
  meta: end_role
  when: not (rpi_macos_allowed | bool)

- block:
    - name: Ensure Raspberry Pi Imager is present via Homebrew Cask (macOS)
      community.general.homebrew_cask:
        name: raspberry-pi-imager
        state: present
      become: false
  when: rpi_macos_allowed | bool

- name: Mark role as executed
  set_fact:
    "{{ role_execution_flag }}": true
    cacheable: true
