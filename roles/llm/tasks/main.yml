---
# tasks file for llm (install ollama, gemini-cli, chatgpt on macOS)

- name: Skip if role already executed
  ansible.builtin.meta: end_role
  when: vars[role_execution_flag] | default(false)

- name: Determine allowed platform for LLM tooling (macOS MacBook only)
  ansible.builtin.set_fact:
    llm_macos_allowed: >-
      {{ (ansible_facts['os_family'] | default('')) == 'Darwin' and (device_type | default('')) == 'macbook' }}

- name: Stop role when not on a supported platform (macOS MacBook)
  ansible.builtin.meta: end_role
  when: not (llm_macos_allowed | bool)

- name: Conditional block for llm

  when: llm_macos_allowed | bool

  block:
    - name: Ensure ollama is installed via Homebrew (macOS)
      community.general.homebrew:
        name: ollama
        state: present
      become: false

    - name: Ensure gemini-cli is installed via Homebrew (macOS)
      community.general.homebrew:
        name: gemini-cli
        state: present
      failed_when: false
      become: false

    - name: Ensure ChatGPT desktop is present via Homebrew Cask (macOS)
      community.general.homebrew_cask:
        name: chatgpt
        state: present
      become: false
- name: Mark role as executed
  ansible.builtin.set_fact:
    "{{ role_execution_flag }}": true
    cacheable: true
