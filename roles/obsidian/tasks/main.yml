---
# tasks file for obsidian (install via Homebrew Cask on macOS)

- name: Skip if role already executed
  ansible.builtin.meta: end_role
  when: vars[role_execution_flag] | default(false)

- name: Determine allowed platform for Obsidian setup (macOS MacBook only)
  ansible.builtin.set_fact:
    obsidian_macos_allowed: >-
      {{ (ansible_facts['os_family'] | default('')) == 'Darwin' and (device_type | default('')) == 'macbook' }}

- name: Stop role when not on a supported platform (macOS MacBook)
  ansible.builtin.meta: end_role
  when: not (obsidian_macos_allowed | bool)

- name: Conditional block for obsidian

  when: obsidian_macos_allowed | bool

  block:
    - name: Ensure Obsidian is present via Homebrew Cask (macOS)
      community.general.homebrew_cask:
        name: obsidian
        state: present
      become: false
- name: Mark role as executed
  ansible.builtin.set_fact:
    "{{ role_execution_flag }}": true
    cacheable: true
