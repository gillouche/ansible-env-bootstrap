---
# tasks file for yubikey — install YubiKey Manager (ykman) via Homebrew on macOS

- name: Determine allowed platform for YubiKey tooling setup (macOS MacBook only)
  ansible.builtin.set_fact:
    yubikey_macos_allowed: >-
      {{ (ansible_facts['os_family'] | default('')) == 'Darwin' and (device_type | default('')) == 'macbook' }}

- name: Stop role when not on a supported platform (macOS MacBook)
  ansible.builtin.meta: end_role
  when: not (yubikey_macos_allowed | bool)

- name: Conditional block for yubikey

  when: yubikey_macos_allowed | bool

  block:
    - name: Ensure YubiKey Manager (ykman) is installed via Homebrew (macOS)
      community.general.homebrew:
        name:
          - ykman
        state: present
      become: false
