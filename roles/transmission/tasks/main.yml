---
# tasks file for transmission (install via Homebrew Cask on macOS)

- name: Determine allowed platform for Transmission setup (macOS MacBook only)
  ansible.builtin.set_fact:
    transmission_macos_allowed: >-
      {{ (ansible_facts['os_family'] | default('')) == 'Darwin' and (device_type | default('')) == 'macbook' }}

- name: Stop role when not on a supported platform (macOS MacBook)
  ansible.builtin.meta: end_role
  when: not (transmission_macos_allowed | bool)

- name: Conditional block for transmission

  when: transmission_macos_allowed | bool

  block:
    - name: Ensure Transmission is present via Homebrew Cask (macOS)
      community.general.homebrew_cask:
        name: transmission
        state: present
      become: false
