---
# tasks file for qemu (install QEMU and UTM on macOS)

- name: Skip if role already executed
  meta: end_role
  when: vars[role_execution_flag] | default(false)

- name: Determine allowed platform for qemu setup (macOS MacBook only)
  set_fact:
    qemu_macos_allowed: >-
      {{ (ansible_facts['os_family'] | default('')) == 'Darwin' and (device_type | default('')) == 'macbook' }}

- name: Stop role when not on a supported platform (macOS MacBook)
  meta: end_role
  when: not (qemu_macos_allowed | bool)

- block:
    - name: Ensure QEMU is installed via Homebrew (macOS)
      community.general.homebrew:
        name: qemu
        state: present
      become: false

    - name: Ensure UTM is present via Homebrew Cask (macOS)
      community.general.homebrew_cask:
        name: utm
        state: present
      become: false
  when: qemu_macos_allowed | bool

- name: Mark role as executed
  set_fact:
    "{{ role_execution_flag }}": true
    cacheable: true
