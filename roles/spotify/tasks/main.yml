---
# tasks file for spotify (install via Homebrew Cask on macOS)

- name: Determine allowed platform for Spotify setup (macOS MacBook only)
  ansible.builtin.set_fact:
    spotify_macos_allowed: >-
      {{ (ansible_facts['os_family'] | default('')) == 'Darwin' and (device_type | default('')) == 'macbook' }}

- name: Stop role when not on a supported platform (macOS MacBook)
  ansible.builtin.meta: end_role
  when: not (spotify_macos_allowed | bool)

- name: Conditional block for spotify

  when: spotify_macos_allowed | bool

  block:
    - name: Ensure Spotify is present via Homebrew Cask (macOS)
      community.general.homebrew_cask:
        name: spotify
        state: present
      become: false
