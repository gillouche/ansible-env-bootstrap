---
# tasks file for qobuz (install via Homebrew Cask on macOS)

- name: Determine allowed platform for Qobuz setup (macOS MacBook only)
  ansible.builtin.set_fact:
    qobuz_macos_allowed: >-
      {{ (ansible_facts['os_family'] | default('')) == 'Darwin' and
         (device_type | default('')) == 'macbook' }}

- name: Stop role when not on a supported platform (macOS MacBook)
  ansible.builtin.meta: end_role
  when: not (qobuz_macos_allowed | bool)

- name: Conditional block for qobuz

  when: qobuz_macos_allowed | bool

  block:
    - name: Ensure Qobuz is present via Homebrew Cask (macOS)
      community.general.homebrew_cask:
        name: qobuz
        state: present
      become: false
