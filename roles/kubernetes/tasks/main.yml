---
# tasks file for kubernetes (kubectl + minikube; Rancher Desktop UI) — macOS only

- name: Determine allowed platform for Kubernetes tooling setup (macOS MacBook only)
  ansible.builtin.set_fact:
    k8s_macos_allowed: >-
      {{ (ansible_facts['os_family'] | default('')) == 'Darwin' and (device_type | default('')) == 'macbook' }}

- name: Stop role when not on a supported platform (macOS MacBook)
  ansible.builtin.meta: end_role
  when: not (k8s_macos_allowed | bool)

- name: Conditional block for kubernetes

  when: k8s_macos_allowed | bool

  block:
    - name: Ensure kubernetes CLI tools are installed via Homebrew (macOS)
      community.general.homebrew:
        name:
          - kubectl
          - minikube
          - k9s
          - kubectx
          - kubeseal
          - argocd
          - derailed/popeye/popeye
          - argoproj/tap/kubectl-argo-rollouts
        state: present
      become: false
