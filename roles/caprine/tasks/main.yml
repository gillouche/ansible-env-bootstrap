---
# tasks file for caprine (install via Homebrew Cask on macOS)

- name: Determine allowed platform for Caprine setup (macOS MacBook only)
  ansible.builtin.set_fact:
    caprine_macos_allowed: >-
      {{ (ansible_facts['os_family'] | default('')) == 'Darwin' and (device_type | default('')) == 'macbook' }}

- name: Stop role when not on a supported platform (macOS MacBook)
  ansible.builtin.meta: end_role
  when: not (caprine_macos_allowed | bool)

- name: Conditional block for caprine

  when: caprine_macos_allowed | bool

  block:
    - name: Ensure Caprine is present via Homebrew Cask (macOS)
      community.general.homebrew_cask:
        name: caprine
        state: present
      become: false
