---
# tasks file for gpg (install gnupg and GPGFrontend on macOS)

- name: Skip if role already executed
  meta: end_role
  when: vars[role_execution_flag] | default(false)

- name: Determine allowed platform for GPG setup (macOS MacBook only)
  set_fact:
    gpg_macos_allowed: >-
      {{ (ansible_facts['os_family'] | default('')) == 'Darwin' and (device_type | default('')) == 'macbook' }}

- name: Stop role when not on a supported platform (macOS MacBook)
  meta: end_role
  when: not (gpg_macos_allowed | bool)

- block:
    - name: Ensure gpg tooling is installed via Homebrew (macOS)
      community.general.homebrew:
        name:
          - gnupg
          - pinentry-mac
        state: present
      become: false

    - name: Define dotfiles paths
      set_fact:
        # Prefer dotfiles_dir from previous roles (home_setup or dotfiles); fallback to projects path
        dotfiles_dir: "{{ (dotfiles_dir | default(ansible_env.HOME + '/Desktop/workspace/projects/dotfiles')) }}"
        user_home_dir: "/Users/{{ target_user }}"
        target_group: staff

    - name: Ensure ~/.gnupg directory exists with secure permissions
      ansible.builtin.file:
        path: "/{{ user_home_dir }}/.gnupg"
        state: directory
        mode: '0700'
      become: false

    - name: Link gpg.conf from dotfiles if available
      ansible.builtin.file:
        src: "{{ dotfiles_dir }}/gpg/gpg.conf"
        dest: "/{{ user_home_dir }}/.gnupg/gpg.conf"
        state: link
      become: false

    - name: Link gpg-agent.conf from dotfiles if available
      ansible.builtin.file:
        src: "{{ dotfiles_dir }}/gpg/gpg-agent.conf"
        dest: "/{{ user_home_dir }}/.gnupg/gpg-agent.conf"
        state: link
      become: false
  when: gpg_macos_allowed | bool

- name: Mark role as executed
  set_fact:
    "{{ role_execution_flag }}": true
    cacheable: true
