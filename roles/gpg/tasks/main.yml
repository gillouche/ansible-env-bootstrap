---
# tasks file for gpg (install gnupg and GPGFrontend on macOS)

- name: Skip if role already executed
  meta: end_role
  when: vars[role_execution_flag] | default(false)

- name: Determine allowed platform for GPG setup (macOS MacBook only)
  set_fact:
    gpg_macos_allowed: >-
      {{ (ansible_facts['os_family'] | default('')) == 'Darwin' and (device_type | default('')) == 'macbook' }}

- name: Stop role when not on a supported platform (macOS MacBook)
  meta: end_role
  when: not (gpg_macos_allowed | bool)

- block:
    - name: Ensure gnupg is installed via Homebrew (macOS)
      community.general.homebrew:
        name: gnupg
        state: present
      become: false

    - name: Ensure GPGFrontend is present via Homebrew Cask (macOS)
      community.general.homebrew_cask:
        name: gpgfrontend
        state: present
      become: false
  when: gpg_macos_allowed | bool

- name: Mark role as executed
  set_fact:
    "{{ role_execution_flag }}": true
    cacheable: true
